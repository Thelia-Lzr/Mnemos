name: Frontend tests
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: node --test bridge/server.test.mjs
