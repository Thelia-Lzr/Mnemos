name: Workspace tests

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]

jobs:
  smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps
      - run: npx playwright test tests/frontend-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 30

  workspace:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: python -m venv python_backend/.venv
      - run: python_backend/.venv/bin/python -m pip install -r python_backend/requirements.txt
      - run: .venv/bin/python -m pytest
        working-directory: python_backend
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/test-workspace.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-workspace-report
          path: playwright-report/
          retention-days: 30
