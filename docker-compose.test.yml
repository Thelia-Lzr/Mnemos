version: '3.8'

services:
  postgres-test:
    image: postgres:15
    container_name: ai-language-learning-postgres-test
    environment:
      POSTGRES_DB: ai_language_learning_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # 使用5433端口避免与本地PostgreSQL冲突
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: ai-language-learning-redis-test
    ports:
      - "6380:6379"  # 使用6380端口避免与本地Redis冲突
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
  redis_test_data: